services:
  postgres:
    image: postgres:15-alpine
    container_name: stackgpt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: stock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stackgpt_backend
    restart: unless-stopped
    environment:
      - PROJECT_NAME=AI Stock Research Assistant Backend
      - API_V1_STR=/api/v1
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/stock_db
      - SECRET_KEY=ai-stock-research-assistant-super-secret-key-change-in-production
      - BACKEND_CORS_ORIGINS=["http://localhost","http://localhost:3000","http://localhost:80","http://127.0.0.1:3000"]
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WEB_SEARCH_API_KEY=${WEB_SEARCH_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_chromadb:/app/chroma_db
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: stackgpt_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
  backend_uploads:
  backend_chromadb:

networks:
  app_network:
    driver: bridge
